name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shim:
    name: build GTK/WebKitGTK shim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build shim
        run: bash shim/linux/build.sh
